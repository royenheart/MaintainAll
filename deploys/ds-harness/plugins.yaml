# dsh 插件部署清单。
#
# 后续新增插件: 复制一个条目, 改 name/path/git 即可。deploy.py 会逐个调用每个
# 插件目录里的 install.py install/uninstall; 插件目录本身按
# dsh-plugin-skills-manager 的 install.py 约定维护 profile 里的共享
# maintainall.yml 与 cordis:include 条目。
#
# `path` 目录不存在时, deploy.py 会尝试用 `git` 克隆; 仓库尚未推送时保持下面的
# 占位 URL 不变, 手动 clone/放置目录后再跑 deploy。`git` 只用于 clone 到 path,
# 不会把 URL 传给 `dsh plugin add`（后者始终收 `link:<本地目录>`）。
plugins:
  - name: dsh-plugin-skills-manager
    path: ~/projects/dsh-plugins/dsh-plugin-skills-manager
    # 占位: 尚未推送。推送后 deploy 即可在新机器上自动 clone。
    git: https://github.com/royenheart/dsh-plugin-skills-manager.git
