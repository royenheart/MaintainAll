[project]
name = "vosk-audio-speech-extract"
version = "0.2.0"
description = "Audio/video speech extraction with multiple ASR backends and subtitle processing"
requires-python = ">=3.10"

dependencies = [
    "textual",
    "ffmpeg-python",
    "keyring",
    "vosk>=0.3.45",
    "openai-whisper",
    "boto3",
    "requests",
    "openai>=1.0",
]

[project.scripts]
speech-extract = "speech_extractor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["speech_extractor.py"]
