name: Skill benchmark checks

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'skills/**'
      - 'tests/test_art_creation_ab.py'
      - 'tests/test_art_creation_feedback.py'
      - 'tests/test_art_creation_complex.py'
      - '.github/workflows/skill-benchmark.yml'
      - 'docs/research/skill-benchmark-architecture-2026-10-09/outputs/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-benchmark-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline contracts and calibration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Install isolated locked benchmark environment
        run: uv sync --project benchmarks/skill_bench --frozen
      - name: Validate task requirements, assets and rubrics
        shell: bash
        run: |
          find benchmarks -name suite.json -type f -print0 | while IFS= read -r -d '' suite; do
            uv run --project benchmarks/skill_bench skill-bench validate --suite "$suite"
          done
      - name: Run deterministic framework and grading tests
        run: uv run --project benchmarks/skill_bench python -m unittest discover -s benchmarks/skill_bench/tests -v
      - name: Run offline legacy sandbox and feedback regression tests
        run: uv run --project benchmarks/skill_bench python -m unittest discover -s tests -p 'test_art_creation_*.py' -v
      - name: Check skill resource index
        run: uv run --project benchmarks/skill_bench python skills/art-creation/scripts/check_index.py --root skills/art-creation
