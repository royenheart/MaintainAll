id: modulefiles-scan-generate
name: 扫描并生成 modulefiles
description: |
  扫描指定软件安装目录，用 manage_modules.py scan 批量解析并生成 Environment Modules 配置。
skills: [modulefile-manager]
schedule: null
notify:
  on_complete: true
  on_failure: true
allowed_commands:
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py scan .+$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py list( .*)?$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py add .+$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py delete .+$'
    cwd: '.'
tasks:
  - id: scan-install-tree
    name: 扫描安装目录
    needs: []
    instruction: |
      对用户或任务指定的安装根目录运行
      `python scripts/modulefiles/manage_modules.py scan <dir>`，
      记录生成/跳过的软件包。
    expect:
      type: contains
      patterns: ['scan', 'module']
  - id: verify-list
    name: 核对列表
    needs: [scan-install-tree]
    instruction: |
      运行 `python scripts/modulefiles/manage_modules.py list`，确认新 modulefile 已出现。
    expect:
      type: contains
      patterns: ['module']
  - id: write-report
    name: 写入报告
    needs: [verify-list]
    instruction: |
      汇总扫描与列表结果，写入标准报告（含 ## scan 与 ## modules）。
    expect:
      type: file_exists
      path_glob: '.agents/reports/modulefiles-scan-generate-*.md'
