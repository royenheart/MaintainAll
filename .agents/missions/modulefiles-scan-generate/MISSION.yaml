id: modulefiles-scan-generate
name: 扫描并生成 modulefiles
description: |
  扫描指定软件安装目录（默认 /opt/software），用 manage_modules.py scan
  批量解析并生成 Environment Modules 配置。
skills: [modulefile-manager]
schedule: null
notify:
  on_complete: true
  on_failure: true
allowed_commands:
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py scan .+$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py list( .*)?$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py add .+$'
    cwd: '.'
  - pattern: '^python3? scripts/modulefiles/manage_modules\.py delete .+$'
    cwd: '.'
tasks:
  - id: scan-install-tree
    name: 扫描安装目录
    needs: []
    instruction: |
      扫描 /opt/software（若用户指定其他根目录，用 ReAct RUN 覆盖）。
      成功时 stdout 通常含「已生成」与「modulefile」。
      用 OBSERVE 写入 ## scan。
    script: python scripts/modulefiles/manage_modules.py scan /opt/software
    expect:
      type: contains
      patterns: ['已生成', 'modulefile']
  - id: verify-list
    name: 核对列表
    needs: [scan-install-tree]
    instruction: |
      列出已管理 modulefile，确认扫描结果已出现；用 OBSERVE 写入 ## modules。
    script: python scripts/modulefiles/manage_modules.py list
    expect:
      type: contains
      patterns: ['modulefile']
  - id: write-report
    name: 写入报告
    needs: [verify-list]
    instruction: |
      确认报告含 ## scan 与 ## modules，并落盘到
      .maintainall/reports/modulefiles-scan-generate-*.md。
    script: python scripts/modulefiles/manage_modules.py list
    expect:
      type: file_exists
      path_glob: '.maintainall/reports/modulefiles-scan-generate-*.md'
