id: daed-connectivity-check
name: Daed 连通性与路由检查
description: |
  检查各 proxy 经当前 gost 代理的连通性，并核对 telegram CIDR/域名是否与官方一致。
skills: [daed-connectivity]
schedule: null
notify:
  on_complete: true
  on_failure: true
allowed_commands:
  - pattern: '^curl -sS( -m \d+)? https://core\.telegram\.org/resources/cidr\.txt$'
    cwd: '.'
  - pattern: '^curl -x socks5://127\.0\.0\.1:20170 -I -m \d+ https://.+$'
    cwd: '.'
  - pattern: '^curl -x http://127\.0\.0\.1:20171 -I -m \d+ https://.+$'
    cwd: '.'
  - pattern: '^cat deploy/daed/config/(routing\.conf|groups\.txt)$'
    cwd: '.'
tasks:
  - id: load-config
    name: 读取 daed 配置
    needs: []
    instruction: |
      读取 deploy/daed/config/routing.conf 与 groups.txt，列出 sticky outbound groups。
    expect:
      type: contains
      patterns: ['telegram', 'proxy']
  - id: probe-proxies
    name: 经当前代理测连通
    needs: [load-config]
    instruction: |
      对需测目标用 curl -x socks5://127.0.0.1:20170 -I -m 10 …；不通则记录到报告草稿。
    expect:
      type: report_section
      name: connectivity
  - id: check-telegram-cidr
    name: 核对 Telegram CIDR
    needs: [load-config]
    instruction: |
      拉取官方 cidr.txt，与 routing.conf 中 dip(...) 比对，输出增删建议。
    expect:
      type: report_section
      name: cidr-diff
  - id: write-report
    name: 汇总报告
    needs: [probe-proxies, check-telegram-cidr]
    instruction: 合并连通性与 CIDR 结果，写入标准报告格式（含 ## connectivity 与 ## cidr-diff）。
    expect:
      type: file_exists
      path_glob: '.agents/reports/daed-connectivity-check-*.md'
