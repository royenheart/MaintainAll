set -g history-limit 5000

# ============================================================
# Tmux 配置文件
# ============================================================

# --- 基础设置 ---
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on

# ============================================================
# 1. Vi 模式 —— 类 Vim 操作
# ============================================================

# 开启 vi 风格的按键绑定
setw -g mode-keys vi

# 进入复制模式：前缀 + [ （默认），或更顺手的 Prefix+Escape
bind Escape copy-mode

# 复制模式内的 vi 风格按键
bind -T copy-mode-vi v   send -X begin-selection       # v 开始选择
bind -T copy-mode-vi V   send -X select-line            # V 选整行
bind -T copy-mode-vi C-v send -X rectangle-toggle       # Ctrl+v 矩形选择

# Ctrl+C 复制到系统剪贴板（通过 OSC 52 helper 脚本，绕过 tmux 内置 clipboard sync，提高兼容性）
# copy-pipe-and-cancel + OSC 52 helper
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel "~/.tmux/scripts/tmux-osc52-helper.sh"

# 翻页（类 Vim）
bind -T copy-mode-vi C-u send -X halfpage-up            # Ctrl+u 上翻半页
bind -T copy-mode-vi C-d send -X halfpage-down          # Ctrl+d 下翻半页
bind -T copy-mode-vi C-b send -X page-up                # Ctrl+b 上翻整页
bind -T copy-mode-vi C-f send -X page-down              # Ctrl+f 下翻整页

# 在普通模式也可以用 Ctrl+u 直接进入复制模式并上翻半页
bind C-u copy-mode \; send -X halfpage-up

# 移动（类 Vim）
bind -T copy-mode-vi h   send -X cursor-left
bind -T copy-mode-vi l   send -X cursor-right
bind -T copy-mode-vi j   send -X cursor-down
bind -T copy-mode-vi k   send -X cursor-up
bind -T copy-mode-vi w   send -X next-word
bind -T copy-mode-vi b   send -X previous-word
bind -T copy-mode-vi e   send -X next-word-end
bind -T copy-mode-vi 0   send -X start-of-line          # 0 行首
bind -T copy-mode-vi '$' send -X end-of-line            # $ 行尾
bind -T copy-mode-vi g   send -X history-top            # g 顶部
bind -T copy-mode-vi G   send -X history-bottom         # G 底部

# 搜索（类 Vim）
bind -T copy-mode-vi /   command-prompt -p "向下搜索:" "send -X search-forward '%%'"
bind -T copy-mode-vi ?   command-prompt -p "向上搜索:" "send -X search-backward '%%'"
bind -T copy-mode-vi n   send -X search-again
bind -T copy-mode-vi N   send -X search-reverse

# q / Escape 退出复制模式
bind -T copy-mode-vi q   send -X cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# 2. 多 Pane 时只复制当前 Pane 的文字
# ============================================================

# 关闭跨 pane 的鼠标选择同步，确保鼠标选中范围被限制在当前 pane
set -g mouse on

# 鼠标拖选结束后不自动复制，只是保持选中状态
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# rectangle-toggle 默认关闭，避免跨 pane 选区
# 鼠标拖选只在当前 pane 内生效（tmux 原生行为，启用 mouse 后已满足）
# 用 vi 模式复制时同样限定在当前 pane 内

# 同步输入默认关闭（防止误操作同时输入多个 pane）
setw -g synchronize-panes off

# ============================================================
# 3. 其他提升效率的配置
# ============================================================

# 重新映射前缀键为 Ctrl+a（更顺手，可按需注释掉）
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# 用 | 和 - 分割 pane，且在当前目录打开
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 用 hjkl 在 pane 间移动
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 用 Shift+方向键调整 pane 大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# r 快速重载配置
bind r source-file ~/.tmux.conf \; display "配置已重载！"

# 新建 window/pane 时保留当前路径
bind c new-window -c "#{pane_current_path}"

# 窗口编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 状态栏
set -g status-interval 5
set -g status-left  "[#S] "
set -g status-right "%H:%M %d-%b"

# ============================================================
# 4. 会话保存/恢复 —— tmux-resurrect
# ============================================================

# 保存时恢复 vim/neovim 会话（需配合 vim-obsession 插件）
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# 恢复 pane 内的工作目录
set -g @resurrect-capture-pane-contents 'on'

# 保存当前会话：prefix + Ctrl+s
# 恢复保存的会话：prefix + Ctrl+r
# 选择历史快照恢复：prefix + Alt+r（需要 fzf）
# 选择历史快照删除：prefix + Alt+d（需要 fzf）
bind M-r display-popup -E -w 90% -h 80% "~/.tmux/scripts/tmux-resurrect-menu restore"
bind M-d display-popup -E -w 90% -h 80% "~/.tmux/scripts/tmux-resurrect-menu delete"

# 自动更新 tmux：prefix + T
bind T run-shell "~/.tmux/scripts/update-tmux.sh"

# opencode
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\a'

# ============================================================
# Tmux Plugin Manager (TPM) & 插件列表
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 初始化 TPM（必须放在配置文件最后）
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' {
	run '~/.tmux/plugins/tpm/tpm'
} {
	run-shell "git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && tmux source-file ~/.tmux.conf && tmux display-message -d 5000 'TPM 已安装并加载, 按 prefix+I 安装插件'"
}
