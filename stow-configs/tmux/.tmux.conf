set -g history-limit 5000

# ============================================================
# Tmux configuration
# ============================================================

# --- Basics ---
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on

# ============================================================
# 1. Vi mode — vim-like navigation
# ============================================================

# Use vi-style key bindings in copy mode and the status line
setw -g mode-keys vi

# Enter copy mode: prefix + [ (default), or the handier prefix + Escape
bind Escape copy-mode

# Vi-style keys inside copy mode
bind -T copy-mode-vi v   send -X begin-selection        # v: begin selection
bind -T copy-mode-vi V   send -X select-line            # V: select whole line
bind -T copy-mode-vi C-v send -X rectangle-toggle       # Ctrl+v: rectangular selection

# Ctrl+C copies to the system clipboard through the OSC 52 helper script
# (bypasses tmux's built-in clipboard sync for wider terminal compatibility)
bind -T copy-mode-vi C-c send -X copy-pipe-and-cancel "~/.tmux/scripts/tmux-osc52-helper.sh"

# Paging (vim-like)
bind -T copy-mode-vi C-u send -X halfpage-up            # Ctrl+u: half page up
bind -T copy-mode-vi C-d send -X halfpage-down          # Ctrl+d: half page down
bind -T copy-mode-vi C-b send -X page-up                # Ctrl+b: full page up
bind -T copy-mode-vi C-f send -X page-down              # Ctrl+f: full page down

# From normal mode, Ctrl+u jumps straight into copy mode and scrolls up
bind C-u copy-mode \; send -X halfpage-up

# Movement (vim-like)
bind -T copy-mode-vi h   send -X cursor-left
bind -T copy-mode-vi l   send -X cursor-right
bind -T copy-mode-vi j   send -X cursor-down
bind -T copy-mode-vi k   send -X cursor-up
bind -T copy-mode-vi w   send -X next-word
bind -T copy-mode-vi b   send -X previous-word
bind -T copy-mode-vi e   send -X next-word-end
bind -T copy-mode-vi 0   send -X start-of-line          # 0: start of line
bind -T copy-mode-vi '$' send -X end-of-line            # $: end of line
bind -T copy-mode-vi g   send -X history-top            # g: top of history
bind -T copy-mode-vi G   send -X history-bottom         # G: bottom of history

# Searching (vim-like)
bind -T copy-mode-vi /   command-prompt -p "Search down:" "send -X search-forward '%%'"
bind -T copy-mode-vi ?   command-prompt -p "Search up:" "send -X search-backward '%%'"
bind -T copy-mode-vi n   send -X search-again
bind -T copy-mode-vi N   send -X search-reverse

# q / Escape leave copy mode
bind -T copy-mode-vi q   send -X cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# 2. Copy only the current pane with multiple panes
# ============================================================

# Keep mouse selection confined to the current pane
set -g mouse on

# Do not auto-copy after a mouse drag ends; keep the selection highlighted
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# rectangle-toggle stays off so selections never span panes
# (mouse drag is confined to the current pane natively once "mouse" is on)
# vi-mode copying is likewise limited to the current pane

# Synchronized input is off by default (prevents typing into several panes at once)
setw -g synchronize-panes off

# ============================================================
# 3. Other productivity settings
# ============================================================

# Optionally remap the prefix to Ctrl+a (uncomment to enable)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Split panes with | and -, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + arrows
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# r: reload configuration quickly
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Keep the current path when creating windows/panes
bind c new-window -c "#{pane_current_path}"

# Start window/pane numbering at 1 and renumber automatically
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-interval 5
set -g status-left  "[#S] "
# Right side: autosave state (prefix + S toggles) | time; options live in §4.1
set -g status-right "#{?@autosave-enabled,#[fg=colour34]AUTOSAVE ON(#{@autosave-interval-label})#[default],#[fg=colour160]AUTOSAVE OFF#[default]} | %H:%M %d-%b"

# ============================================================
# 4. Session save/restore — tmux-resurrect (incl. periodic autosave)
# ============================================================

# Restore vim/neovim sessions on save (needs the vim-obsession plugin)
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Restore each pane's working directory
set -g @resurrect-capture-pane-contents 'on'

# Save current session: prefix + Ctrl+s
# Restore saved session: prefix + Ctrl+r
# Pick a snapshot to restore: prefix + Alt+r (needs fzf)
# Pick a snapshot to delete: prefix + Alt+d (needs fzf)
bind M-r display-popup -E -w 90% -h 80% "~/.tmux/scripts/tmux-resurrect-menu restore"
bind M-d display-popup -E -w 90% -h 80% "~/.tmux/scripts/tmux-resurrect-menu delete"

# ------------------------------------------------------------
# 4.1 Periodic autosave (backed by tmux-resurrect; prefix + S toggles)
# ------------------------------------------------------------
# Goal: on unexpected shutdown/disconnect you lose at most one save cycle.
# How it works: ~/.tmux/scripts/tmux-autosave.sh runs a background loop
#   started here via run-shell -b. Its PID is stored in @autosave-loop-pid
#   so a prefix + r reload cannot spawn a second instance.
#   On every wake it re-reads the options: when @autosave-enabled = 1 and
#   tmux-resurrect is installed it quietly calls resurrect's save.sh to
#   snapshot all sessions; if resurrect is missing the save is skipped
#   (it kicks in from the next cycle once the plugin is installed).
#   @autosave-interval holds the interval in SECONDS (default 300 = 5m);
#   the humanized label shown in the status line lives in
#   @autosave-interval-label and is refreshed by the loop and by the
#   settings popup (prefix + M-s).
# Defaults are written only when the option is unset, so prefix + r
# reloads never reset the runtime toggle or interval.
if-shell '[ -z "$(tmux show-option -gqv @autosave-enabled 2>/dev/null)" ]' 'set -g @autosave-enabled 1'
if-shell '[ -z "$(tmux show-option -gqv @autosave-interval 2>/dev/null)" ]' 'set -g @autosave-interval 300'
run-shell -b "~/.tmux/scripts/tmux-autosave.sh"
# prefix + S: toggle autosave (turning it on saves immediately)
bind S if-shell '[ "$(tmux show-option -gqv @autosave-enabled 2>/dev/null)" = "1" ]' 'set -g @autosave-enabled 0; display-message "Autosave OFF (prefix + Ctrl+s still saves manually)"' 'set -g @autosave-enabled 1; run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"; display-message "Autosave ON (every #{@autosave-interval-label})"'
# prefix + M-s: open the autosave settings popup (toggle + interval editor)
bind M-s display-popup -E -w 70% -h 60% "~/.tmux/scripts/tmux-autosave-menu"

# Auto-update tmux: prefix + T
bind T run-shell "~/.tmux/scripts/update-tmux.sh"

# opencode
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\a'

# ============================================================
# Tmux Plugin Manager (TPM) & plugin list
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (must stay at the end of the config)
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' {
	run '~/.tmux/plugins/tpm/tpm'
} {
	run-shell "git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && tmux source-file ~/.tmux.conf && tmux display-message -d 5000 'TPM installed and loaded; press prefix+I to install plugins'"
}
