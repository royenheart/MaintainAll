[login]
m1 ansible_host=m1

[management]
m2 ansible_host=m2

[compute]
; regex match see: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html#adding-ranges-of-hosts
; compute[1:100] ansible_host=intern[1:100]
m[3:4] ansible_host=m[3:4] cpu=4 memory=6G partition="cpu_partition"
; g[1:100] ansible_host=g[1:100] cpu=4 memory=6G partition="gpu_partition" gres='{"name": "gpu", "type": "a100"}'

[compute:partitions]
cpu_partition = {"name": "CPU", "priority": 5, "DefaultMemPerCpu": 0, "MaxMemPerCpu": 0}
; gpu_partition = {"name": "GPU", "priority": 3, "DefaultMemPerCpu": 0, "MaxMemPerCpu": 0, "AllowedAccounts": "ai-team"}

[all:vars]
disable_firewall=true
disable_security=true
frontend_path=/usr/local/bin

cluster_name=pkuhpc
crane_version=1.1.2

; Database
DbUser=admin
DbPassword="123456"
; Will install database if sets to 'localhost' or '127.0.0.1'
DbHost=127.0.0.1
DbPort=27017
DbReplSetName=crane_rs
DbName=crane_db