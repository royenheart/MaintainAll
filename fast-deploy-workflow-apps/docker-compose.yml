  services_grafana_storage: {}
  services_prometheus_storage: {}
  services_alertmanager_storage: {}
  services_jupyterhub_storage: {}
  services_gitlab_log: {}
  services_gitlab_data: {}
  services_jupyterhub_home: {}
  services_jupyterhub_shared: {}