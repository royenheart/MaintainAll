tproxy_port: "12345"
tproxy_port_protect: "true"
log_level: "info"
# IPv4-only health checks: IPv6 probe targets mark tcp6 dialers NOT ALIVE and
# then break IPv4 GitHub traffic with "proxy (tcp6): no alive dialer".
tcp_check_url: "http://cp.cloudflare.com,1.1.1.1"
tcp_check_http_method: "HEAD"
udp_check_dns: "dns.google:53,8.8.8.8"
check_interval: "60s"
check_tolerance: "500ms"
lan_interface: "wlp3s0"
wan_interface: "auto"
dial_mode: "domain"
allow_insecure: "false"
auto_config_kernel_parameter: "true"
sniffing_timeout: "100ms"
tls_implementation: "tls"
utls_imitate: "chrome_auto"
enable_local_tcp_fast_redirect: "true"
# Prefer a domestically reachable bootstrap resolver for node/DoH hostname lookup
# when system DNS or foreign resolvers flap.
fallback_resolver: "223.5.5.5:53"
bandwidth_max_tx: "200 mbps"
bandwidth_max_rx: "1 gbps"
