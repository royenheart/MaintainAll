# Bypass local DNS/network services
pname(daed) -> must_direct
pname(NetworkManager, systemd-resolved, dnsmasq) -> must_direct
pname(tailscaled) -> must_direct
domain(keyword: tailscale) -> must_direct
domain(suffix: ts.net) -> must_direct
dip(100.64.0.0/10, 100.100.100.100/32, 'fd7a:115c:a1e0::/48') -> must_direct

# LAN broadcast
dip(224.0.0.0/3, 'ff00::/8') -> direct

# Private IPs direct
dip(geoip:private) -> direct

# Non-standard ports direct (avoid BT/proxy)
!dport(21, 22, 23, 53, 80, 123, 143, 194, 443, 465, 587, 853, 993, 995, 998) -> direct

# Block ads
domain(geosite:category-ads, geosite:category-ads-all) -> block

# Direct for Chinese services
domain(geosite:apple@cn) -> direct
domain(geosite:alibaba) -> direct
domain(geosite:microsoft@cn) -> direct
domain(geosite:steam@cn) -> direct
domain(suffix: cm.steampowered.com) -> direct
domain(suffix: steamserver.net) -> direct
domain(geosite:tencent) -> direct
domain(geosite: category-games@cn) -> direct

# WeChat direct
domain(suffix: cdn-go.cn) -> direct
domain(suffix: smtcdns.com) -> direct
domain(suffix: smtcdns.net) -> direct

# Proxy for foreign services
domain(geosite:openai) -> proxy
domain(geosite:github) -> proxy
domain(geosite:docker) -> proxy
domain(geosite:google) -> proxy
domain(suffix: gradle.org) -> proxy
domain(suffix: linux.do) -> proxy
domain(keyword: tradingview) -> proxy

# Block QUIC to reduce CPU load
l4proto(udp) && dport(443) -> block

# Geo-based routing
dip(geoip:cn) -> direct
domain(geosite:cn) -> direct

# Fallback
fallback: proxy
