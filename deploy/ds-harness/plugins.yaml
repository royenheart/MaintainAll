# dsh 插件部署清单。
#
# 每个插件必须是 dsh profile bundle（package.json 声明 dsh.bundle.patch），
# 这样 `dsh plugin add <git-url>` 会自动把它 reconcile 进
# dsh.profile.bundles；不再维护 maintainall.yml / cordis:include。
#
# deploy.py install 的流程:
#   1. 先 `dsh plugin add <git>` 直装 git-hosted 包（依赖包内 prepare 构建 lib）；
#   2. 失败则 clone 到 fallback_dir（默认 /tmp/dsh-plugins/<name>），
#      构建后 `dsh plugin add file:<dir>` 复制进 profile（装完可删掉 checkout）。
#
# `package` 用于卸载时的 `dsh plugin remove <package>`。
plugins:
  - name: dsh-plugin-skills-manager
    package: '@maintainall/dsh-plugin-skills-manager'
    # 占位: 尚未推送。推送后第 1 步 git 直装即可成功; 推送前本机用下面的
    # fallback_dir 指向本地 checkout。
    git: https://github.com/royenheart/dsh-plugin-skills-manager.git
    # 覆盖默认 /tmp/dsh-plugins/dsh-plugin-skills-manager, 指向本地开发目录。
    fallback_dir: ~/projects/dsh-plugins/dsh-plugin-skills-manager
