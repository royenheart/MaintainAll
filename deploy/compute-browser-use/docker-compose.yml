version: "3.9"

# =============================================================
# Remote Computer Use — Server-side deployment
# =============================================================
#
# Components:
#   1. astrbot        — Message platform gateway (minimal)
#   2. hermes-bridge  — AstrBot → Hermes message forwarding
#   3. hermes-api     — HTTP API wrapper around Hermes Agent
#   cuactl CLI is installed inside hermes-api container
#
# Prerequisites:
#   cp .env.example .env && edit .env
#   docker compose up -d

services:
  # ------------------------------------------------------------------
  # AstrBot — Multi-platform messaging gateway (minimal deployment)
  # ------------------------------------------------------------------
  astrbot:
    image: soulter/astrbot:latest
    container_name: cua-astrbot
    restart: unless-stopped
    ports:
      - "6185:6185"
    volumes:
      - ./server/astrbot/cmd_config.json:/app/data/cmd_config.json:ro
      - ./server/hermes-bridge/astrbot_plugin:/app/data/plugins/hermes_forward:ro
      - astrbot_data:/app/data
    environment:
      - ASTRBOT_DASHBOARD_PASSWORD=${ASTRBOT_DASHBOARD_PASSWORD:-}
      - TZ=Asia/Shanghai
    networks:
      - cua-net

  # ------------------------------------------------------------------
  # Hermes Bridge — AstrBot → Hermes API message forwarding
  # ------------------------------------------------------------------
  hermes-bridge:
    build:
      context: ./server/hermes-bridge
      dockerfile: Dockerfile
    container_name: cua-hermes-bridge
    restart: unless-stopped
    ports:
      - "8421:8421"
    environment:
      - HERMES_AGENT_URL=http://hermes-api:8420
      - BRIDGE_PORT=8421
      - AUTH_TOKEN=${BRIDGE_AUTH_TOKEN:-}
    depends_on:
      - hermes-api
    networks:
      - cua-net

  # ------------------------------------------------------------------
  # Hermes API — HTTP wrapper around Hermes Agent
  # ------------------------------------------------------------------
  hermes-api:
    build:
      context: .
      dockerfile: ./server/hermes-api/Dockerfile
    container_name: cua-hermes-api
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - ../external/hermes-agent:/opt/hermes-agent:ro
      - ./server/hermes/config.yaml:/home/hermes/.hermes/config.yaml:ro
      - ./skills:/home/hermes/.hermes/skills:ro
      - hermes_data:/home/hermes/.hermes
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_SRC=/opt/hermes-agent
      - HERMES_MAX_ITERATIONS=30
      - HERMES_API_PORT=8420
      - CUACTL_ENDPOINT=${CUACTL_ENDPOINT}
      - CUACTL_TOKEN=${CUACTL_TOKEN:-}
      - TZ=Asia/Shanghai
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    # Security hardening
    security_opt:
      - no-new-privileges:true
    # Container-level isolation — /opt/hermes-agent is read-only from volume
    tmpfs:
      - /tmp:exec
    networks:
      - cua-net


networks:
  cua-net:
    driver: bridge

volumes:
  astrbot_data:
  hermes_data:
