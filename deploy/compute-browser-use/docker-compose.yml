version: "3.9"

# =============================================================
# Remote Computer Use — Server-side deployment
# =============================================================
#
# Components:
#   1. astrbot        — Message platform gateway (minimal)
#   2. hermes-api     — Hermes Hub (CLI wrapper + REST API + SSE)
#
# Primary connector: astrbot_plugin_hermes_connector (Hub mode)
#   - Pre-installed as AstrBot plugin, talks to hermes-api via HTTPS/HTTP
#   - Full feature set: commands, approval, progress monitor, LLM tools
#
# Fallback: hermes-bridge (disabled by default)
#   - Start with: docker compose --profile bridge up -d
#   - Minimal message forwarding AstrBot → Hermes
#
# Prerequisites:
#   cp .env.example .env && edit .env
#   docker compose up -d

services:
  # ================================================================
  # AstrBot — Multi-platform messaging gateway
  # ================================================================
  astrbot:
    build:
      context: .
      dockerfile: ./server/astrbot/Dockerfile
      args:
        - HERMES_ACCESS_TOKEN=${HERMES_ACCESS_TOKEN}
    container_name: cua-astrbot
    restart: unless-stopped
    ports:
      - "6185:6185"
    volumes:
      # Fallback plugin (hermes_forward) — only with bridge profile.
      # Use: docker compose -f docker-compose.yml -f docker-compose.bridge.yml --profile bridge up -d
      # AstrBot auto-creates it on first run and MUST own it
      # for password/config persistence across redeploys.
      - astrbot_data:/AstrBot/data
    environment:
      - ASTRBOT_DASHBOARD_INITIAL_PASSWORD=${ASTRBOT_DASHBOARD_PASSWORD:-}
      - BRIDGE_AUTH_TOKEN=${BRIDGE_AUTH_TOKEN}
      - HERMES_ACCESS_TOKEN=${HERMES_ACCESS_TOKEN}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cuactl:
        condition: service_healthy
    networks:
      - cua-net

  # ================================================================
  # Hermes Hub — HTTP wrapper around Hermes Agent (via CLI)
  # ================================================================
  hermes-api:
    build:
      context: .
      dockerfile: ./server/hermes-api/Dockerfile
    container_name: cua-hermes-api
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - ./server/hermes/config.yaml:/home/hermes/.hermes/config.yaml
      - ./skills:/home/hermes/.hermes/skills:ro
      - hermes_data:/home/hermes/.hermes
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_MAX_ITERATIONS=30
      # Hub settings
      - HERMES_HOST=0.0.0.0
      - HERMES_PORT=8420
      - HERMES_ACCESS_TOKEN=${HERMES_ACCESS_TOKEN}
      - HERMES_BINARY=hermes
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec
    depends_on:
      cuactl:
        condition: service_healthy
    networks:
      - cua-net

  # ================================================================
  # CUA Relay — HTTP microservice bridging agents → Windows PC
  # ================================================================
  # Exposes /cuactl/<command> endpoints consumed by both hermes-api and
  # astrbot over the cua-net bridge network. Forwards each call as HTTPS
  # + Bearer Token to the Client Control Plane on the Windows PC.
  # No host port mapping — only intra-network access is needed.
  cuactl:
    build:
      context: .
      dockerfile: ./server/cua-relay/Dockerfile.http
    container_name: cua-cuactl
    restart: unless-stopped
    environment:
      - CUACTL_ENDPOINT=${CUACTL_ENDPOINT}
      - CUACTL_TOKEN=${CUACTL_TOKEN:-}
      - TZ=Asia/Shanghai
    networks:
      - cua-net

  # ================================================================
  # Hermes Bridge — Fallback AstrBot → Hermes forwarding
  # ================================================================
  hermes-bridge:
    build:
      context: ./server/hermes-bridge
      dockerfile: Dockerfile
    container_name: cua-hermes-bridge
    restart: unless-stopped
    profiles:
      - bridge
    ports:
      - "8421:8421"
    environment:
      - HERMES_AGENT_URL=http://hermes-api:8420
      - BRIDGE_PORT=8421
      - AUTH_TOKEN=${BRIDGE_AUTH_TOKEN:-}
    depends_on:
      - hermes-api
    networks:
      - cua-net


networks:
  cua-net:
    driver: bridge

volumes:
  astrbot_data:
  hermes_data:
