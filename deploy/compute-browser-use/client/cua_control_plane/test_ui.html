<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUA Control Plane — Test Panel</title>
<style>
:root{--bg:#1e1e2e;--panel:#282840;--accent:#7c3aed;--text:#cdd6f4;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);padding:5px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #45475a;flex-shrink:0;flex-wrap:wrap;min-height:32px}
header h1{font-size:13px;font-weight:600}
.badge{font-size:10px;padding:1px 6px;border-radius:8px}
.badge-ok{background:var(--green);color:#11111b}
.badge-err{background:var(--red);color:#11111b}
#toolbar{background:var(--panel);padding:4px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid #45475a;flex-shrink:0;min-height:30px}
#toolbar button{background:var(--accent);color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
#toolbar button:hover{opacity:.85}
#toolbar button.secondary{background:#45475a}
#toolbar button.active{background:var(--green);color:#11111b}
#toolbar label{font-size:10px;color:#a6adc8}
#toolbar input[type=range]{width:70px;accent-color:var(--accent)}
#toolbar input[type=number]{width:55px;background:#1e1e2e;border:1px solid #45475a;color:var(--text);padding:2px 4px;border-radius:3px;font-size:11px}
.sep{width:1px;height:16px;background:#45475a;margin:0 2px}
main{flex:1;overflow:hidden;position:relative;background:#11111b}
canvas{cursor:crosshair;display:block}
#zoom-tag{position:absolute;bottom:6px;right:10px;font-size:10px;background:#000000aa;color:#ccc;padding:1px 6px;border-radius:3px;pointer-events:none}
#capture-toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;background:#000000cc;color:var(--green);padding:3px 14px;border-radius:4px;pointer-events:none;display:none}
#log{max-height:28vh;overflow-y:auto;font-family:monospace;font-size:11px;background:var(--panel);border-top:1px solid #45475a;padding:3px 10px;flex-shrink:0}
#log .entry{padding:1px 4px;border-radius:2px;margin:1px 0}
.log-info{background:#313244}.log-ok{background:#1e3a1e;color:var(--green)}.log-err{background:#3a1e1e;color:var(--red)}
#warning-bar,#mode-bar{padding:3px 12px;font-size:10px;flex-shrink:0;border-bottom:1px solid #45475a}
#warning-bar{display:none;background:#3a2e00;color:var(--yellow)}
#mode-bar.collaborative{background:#1e3a1e;color:var(--green)}
#mode-bar.solo{background:#3a1e00;color:var(--yellow)}
#mode-bar.blocked{background:#3a1e1e;color:var(--red)}
</style>
</head>
<body>

<div id="warning-bar"></div>
<div id="mode-bar" class="collaborative">Mode: Collaborative</div>

<header>
<h1>CUA Test Panel</h1>
<span id="status-badge" class="badge badge-err">OFFLINE</span>
<span id="screen-badge" class="badge" style="background:#45475a">1 screen</span>
</header>

<div id="toolbar">
<button id="btn-capture" onclick="doCapture()">Screenshot</button>
<span class="sep"></span>
<button id="btn-left" class="active" onclick="setButton('left')">Left</button>
<button id="btn-right" onclick="setButton('right')">Right</button>
<button id="btn-mid" onclick="setButton('middle')">Mid</button>
<button id="btn-dbl" onclick="setButton('dbl')">Dbl</button>
<button onclick="doClick()">Click Here</button>
<button onclick="doMove()" class="secondary">Move</button>
<span class="sep"></span>
<label>X</label><input type="number" id="click-x" value="100" onchange="onCoordInput()">
<label>Y</label><input type="number" id="click-y" value="100" onchange="onCoordInput()">
<span class="sep"></span>
<label>Zoom</label>
<input type="range" id="zoom-slider" min="10" max="200" value="100" oninput="onZoomSlider()">
<span style="font-size:10px;min-width:30px" id="zoom-pct">100%</span>
<button onclick="zoomFit()" class="secondary">Fit</button>
<button onclick="doClearScreenshot()" class="secondary" title="Clear screenshot overlay">Clear</button>
</div>

<main id="main-wrap">
<canvas id="c"></canvas>
<div id="zoom-tag">100%</div>
<div id="capture-toast">Screenshot captured</div>
</main>

<div id="log"></div>

<script>
const A='',c=document.getElementById('c'),ctx=c.getContext('2d');
let screens=[],bounds={x:0,y:0,w:1920,h:1080};
let cp={x:100,y:100},btn='left',zm=1,px=0,py=0,drag=false,ds={x:0,y:0},ssImg=null;

function log(m,cl='log-info'){const d=document.getElementById('log');d.innerHTML+=`<div class="entry ${cl}">${new Date().toLocaleTimeString()} ${m}</div>`;d.scrollTop=d.scrollHeight}

function setButton(b){btn=b;['left','right','middle','dbl'].forEach(x=>{const el=document.getElementById('btn-'+x);if(el)el.classList.toggle('active',x===b)})}
function onCoordInput(){cp.x=parseInt(document.getElementById('click-x').value)||0;cp.y=parseInt(document.getElementById('click-y').value)||0;render()}
function onZoomSlider(){zm=parseInt(document.getElementById('zoom-slider').value)/100;render()}
function zoomFit(){zm=1;px=0;py=0;document.getElementById('zoom-slider').value=100;render()}
function doClearScreenshot(){ssImg=null;render();log('Screenshot overlay cleared')}

async function api(m,p,bd){
 try{
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(typeof LOCAL_TOKEN!=='undefined')o.headers['Authorization']='Bearer '+LOCAL_TOKEN;
  if(bd)o.body=JSON.stringify(bd);
  const r=await fetch(A+p,o); return await r.json();
 }catch(e){return{success:false,error:e.message}}
}

async function loadScreens(){
 try{
  const r=await fetch(A+'/api/v1/screens');const d=await r.json();
  screens=d.screens||[];bounds=d.total_bounds||{x:0,y:0,width:1920,height:1080};
  bounds.w=bounds.width;bounds.h=bounds.height;
  document.getElementById('status-badge').className='badge badge-ok';
  document.getElementById('status-badge').textContent='ONLINE';
  document.getElementById('screen-badge').textContent=screens.length+' screen'+(screens.length!==1?'s':'');
  window.sc=['#cba6f7','#94e2d5','#f9e2af','#f38ba8','#89b4fa','#a6e3a1'];
  render();
 }catch(e){
  document.getElementById('status-badge').className='badge badge-err';
  document.getElementById('status-badge').textContent='OFFLINE';
 }
}

function render(){
 const w=c.parentElement.clientWidth,h=c.parentElement.clientHeight;
 c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px';
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#11111b';ctx.fillRect(0,0,w,h);

 const sc=window.sc||['#cba6f7','#94e2d5','#f9e2af','#f38ba8','#89b4fa','#a6e3a1'];

 ctx.save();
 ctx.translate(w/2+px,h/2+py);
 ctx.scale(zm,zm);
 ctx.translate(-bounds.w/2-bounds.x,-bounds.h/2-bounds.y);

 // Screenshot background (natural size at virtual desktop origin)
 if(ssImg){
  ctx.globalAlpha=.8;
  try{ctx.drawImage(ssImg,bounds.x,bounds.y)}catch(e){}
  ctx.globalAlpha=1;
 }

 // Screen outlines
 screens.forEach((s,i)=>{
  const sx=s.x,sy=s.y,sw=s.width,sh=s.height;
  if(!ssImg){ctx.fillStyle=sc[i%6]+'12';ctx.fillRect(sx,sy,sw,sh)}
  ctx.strokeStyle=sc[i%6];ctx.lineWidth=s.is_primary?3/zm:2/zm;
  ctx.setLineDash(s.is_primary?[]:[4/zm,4/zm]);
  ctx.strokeRect(sx,sy,sw,sh);ctx.setLineDash([]);
  const fs=Math.max(9,12/zm);
  ctx.font=(s.is_primary?'bold ':'')+fs+'px system-ui';
  const lb=s.name||'#'+s.index;const tw=ctx.measureText(lb).width;
  ctx.fillStyle='#000000cc';ctx.fillRect(sx+2,sy+2,tw+10,fs+8);
  ctx.fillStyle=sc[i%6];ctx.fillText(lb,sx+7,sy+fs+2);
 });

 // Click target
 const r=10/zm;
 ctx.strokeStyle='#ff4466';ctx.lineWidth=3/zm;
 ctx.beginPath();ctx.arc(cp.x,cp.y,r,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(cp.x,cp.y,2/zm,0,Math.PI*2);
 ctx.fillStyle='#ff4466';ctx.fill();
 const cl=16/zm;
 ctx.strokeStyle='#ff4466';ctx.lineWidth=1.5/zm;
 ctx.beginPath();
 ctx.moveTo(cp.x-cl,cp.y);ctx.lineTo(cp.x-r-2/zm,cp.y);
 ctx.moveTo(cp.x+r+2/zm,cp.y);ctx.lineTo(cp.x+cl,cp.y);
 ctx.moveTo(cp.x,cp.y-cl);ctx.lineTo(cp.x,cp.y-r-2/zm);
 ctx.moveTo(cp.x,cp.y+r+2/zm);ctx.lineTo(cp.x,cp.y+cl);
 ctx.stroke();
 const fs2=Math.max(8,11/zm);
 ctx.font=fs2+'px monospace';const txt=`(${cp.x},${cp.y})`;
 const tw2=ctx.measureText(txt).width;
 ctx.fillStyle='#000000dd';
 ctx.fillRect(cp.x+cl+3,cp.y-fs2-1,tw2+8,fs2+4);
 ctx.fillStyle='#ff4466';ctx.fillText(txt,cp.x+cl+7,cp.y+2);

 ctx.restore();

 document.getElementById('zoom-pct').textContent=Math.round(zm*100)+'%';
 document.getElementById('zoom-slider').value=Math.round(zm*100);
 document.getElementById('click-x').value=cp.x;
 document.getElementById('click-y').value=cp.y;
}

function toWorld(mx,my){
 const w=c.width,h=c.height;
 return{
  x:Math.round((mx-w/2-px)/zm+bounds.w/2+bounds.x),
  y:Math.round((my-h/2-py)/zm+bounds.h/2+bounds.y)
 };
}

c.addEventListener('mousedown',e=>{
 if(e.button===1||e.altKey){drag=true;ds={x:e.clientX-px,y:e.clientY-py};c.style.cursor='grabbing';e.preventDefault()}
});
c.addEventListener('mousemove',e=>{if(drag){px=e.clientX-ds.x;py=e.clientY-ds.y;render()}});
c.addEventListener('mouseup',e=>{
 if(drag){drag=false;c.style.cursor='crosshair';return}
 const rect=c.getBoundingClientRect();
 const p=toWorld(e.clientX-rect.left,e.clientY-rect.top);
  if(e.button===0||e.button===2){cp.x=p.x;cp.y=p.y;render()}
});
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('wheel',e=>{
 e.preventDefault();
 const rect=c.getBoundingClientRect();
 const mx=e.clientX-rect.left,my=e.clientY-rect.top;
 const before=toWorld(mx,my);
 zm=Math.max(.1,Math.min(3,zm*(e.deltaY<0?1.15:1/1.15)));
 render();
 const after=toWorld(mx,my);
 px+=(after.x-before.x)*zm;py+=(after.y-before.y)*zm;
 render();
});

function doCapture(){
 api('POST','/api/v1/cua/capture').then(d=>{
  if(d.success&&d.base64){
   log('Screenshot captured','log-ok');
   const img=new Image();
   img.onload=()=>{ssImg=img;render();const t=document.getElementById('capture-toast');t.style.display='block';setTimeout(()=>t.style.display='none',2000)};
   img.src='data:'+(d.mime_type||'image/png')+';base64,'+d.base64;
  }else{log('Capture failed: '+(d.error||'unknown'),'log-err')}
 });
}

function doClick(){
 cp.x=parseInt(document.getElementById('click-x').value)||cp.x;
 cp.y=parseInt(document.getElementById('click-y').value)||cp.y;render();
 function lr(d,a){const t=d.method==='background'?' [bg]':d.method==='injected'?' [pen]':'';log((d.success?a+t+' OK':`Error: ${d.error}`),(d.success?'log-ok':'log-err'))}
 if(btn==='dbl'){
  api('POST','/api/v1/cua/click',{x:cp.x,y:cp.y,button:'left'}).then(()=>{
   setTimeout(()=>api('POST','/api/v1/cua/click',{x:cp.x,y:cp.y,button:'left'}).then(d=>lr(d,`Dbl at (${cp.x},${cp.y})`)),200)
  });
 }else{
  api('POST','/api/v1/cua/click',{x:cp.x,y:cp.y,button:btn}).then(d=>lr(d,`${btn} click at (${cp.x},${cp.y})`));
 }
}

function doMove(){
 cp.x=parseInt(document.getElementById('click-x').value)||cp.x;
 cp.y=parseInt(document.getElementById('click-y').value)||cp.y;render();
 api('POST','/api/v1/cua/move',{x:cp.x,y:cp.y}).then(d=>{
  log(d.success?`Moved to (${cp.x},${cp.y})`:`Error: ${d.error}`,d.success?'log-ok':'log-err')
 });
}

async function checkMode(){
 try{const r=await fetch(A+'/api/v1/mode');const d=await r.json();const b=document.getElementById('mode-bar');
  if(d.blocked){b.className='blocked';b.textContent=`Solo — BLOCKED (${d.remaining}s)`}
  else if(d.mode==='solo'){b.className='solo';b.textContent=`Solo (full control) — idle: ${d.idle_seconds}s`}
  else{b.className='collaborative';b.textContent='Collaborative (non-intrusive)'}
 }catch(e){}
}
async function checkStatus(){
 try{const r=await fetch(A+'/api/v1/status');const d=await r.json();if(!d.cua_available)document.getElementById('warning-bar').style.display='block'}
 catch(e){}
}

window.addEventListener('resize',render);
setInterval(loadScreens,30000);setInterval(checkMode,3000);
checkStatus();loadScreens();checkMode();
</script>
</body>
</html>
