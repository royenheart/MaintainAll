networks:
  gitea:
    external: false

volumes:
  gitea:
    driver: local
  gitea_pg:
    driver: local

services:
  server:
    image: ${GITEA_IMAGE:-docker.gitea.com/gitea:latest}
    container_name: gitea
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${GITEA__database__NAME:-gitea}
      - GITEA__database__USER=${GITEA__database__USER:-gitea}
      - GITEA__database__PASSWD=${GITEA__database__PASSWD:-gitea}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-192.168.31.143}
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-http://${GITEA_DOMAIN:-192.168.31.143}:3300/}
      - GITEA__server__PUBLIC_URL_DETECTION=auto
      - GITEA__server__HTTP_ADDR=0.0.0.0
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_DOMAIN=${GITEA_SSH_DOMAIN:-${GITEA_DOMAIN:-192.168.31.143}}
      - GITEA__server__SSH_PORT=3322
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__server__LFS_ALLOW_PURE_SSH=true
    restart: always
    networks:
      - gitea
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3300:3000"
      - "3322:22"
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${GITEA__database__USER:-gitea}
      - POSTGRES_PASSWORD=${GITEA__database__PASSWD:-gitea}
      - POSTGRES_DB=${GITEA__database__NAME:-gitea}
    networks:
      - gitea
    volumes:
      - gitea_pg:/var/lib/postgresql/data
