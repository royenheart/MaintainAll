[project]
name = "compute-use-deploy"
version = "0.1.0"
description = "Remote Computer Use — client control plane + cuactl relay deployment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "click>=8.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
client = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
]
relay = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.0",
    "httpx>=0.28.0",
]

[project.scripts]
compute-use-deploy = "deploy:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["deploy"]

[tool.pytest.ini_options]
pythonpath = ["client"]
testpaths = ["tests", "client/tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests needing mock client or services",
    "e2e: end-to-end tests needing real CUA control plane",
]
